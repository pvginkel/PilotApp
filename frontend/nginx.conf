worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Forwarded header maps — preserve upstream values when behind a reverse proxy
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_x_real_ip $proxy_x_real_ip {
        default $http_x_real_ip;
        ''      $remote_addr;
    }
    # WebSocket connection upgrade map — sends 'upgrade' only when Upgrade header is present
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json;

    server {
        listen 3500;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Cache the build's hashed assets for a year. The files at the root — the icons, the
        # logo, the manifest, the worker — change under their names, so the browser revalidates
        # them on every load: an ETag round trip, a 304 while they stand.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
            add_header Cache-Control "no-cache";
        }

        # Handle client-side routing for SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Handle index.html with no caching
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Proxy API requests to backend, the SSE stream (/api/sse/stream)
        # included: proxy.conf turns response buffering off. ^~ keeps nginx
        # from trying the regex locations on an /api/ path: the cache rule's
        # \.json$ would answer /api/sync/files/*.json from the static root.
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3501;
            include /etc/nginx/snippets/proxy.conf;
        }

        # Health check endpoint for containers
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
