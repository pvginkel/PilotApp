         bottom tabs' tint, app-theme.css's side colour in each scheme, else the top bar's blue. -->
    <meta name="theme-color" data-scheme="dark" media="(max-width: 900px) and (prefers-color-scheme: dark)" content="#111824" />
    <meta name="theme-color" data-scheme="light" media="(max-width: 900px)" content="#f9fafb" />
    <meta name="theme-color" content="#568ed2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
