[tool.poetry]
name = "pilot"
version = "0.1.0"
description = "The project manager that runs multi-step work across the KubeCoder fleet"
authors = ["Pieter van Ginkel <pvginkel@gmail.com>"]
packages = [{include = "tools"}]

[tool.poetry.dependencies]
python = "^3.13"
honcho = "^2"
psutil = "^5"

[tool.poetry.scripts]
run-suite = "tools.suite_runner.local:cli"

[tool.poetry.group.dev.dependencies]
ruff = "0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Pinned to the same rule set and Ruff version backend/ uses, so the gate does
# not float with whatever defaults the toolchain image's Ruff ships.
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ERA",   # eradicate (commented-out code)
    "RUF100", # unused noqa directives
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]
