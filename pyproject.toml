[project]
name = "pilot-workspace"
version = "0.1.0"
description = "The project manager that runs multi-step work across the KubeCoder fleet"
authors = [{ name = "Pieter van Ginkel", email = "pvginkel@gmail.com" }]
requires-python = ">=3.13,<4"
dependencies = [
    "honcho>=2,<3",
    "psutil>=5,<6",
]

[project.scripts]
run-suite = "tools.suite_runner.local:cli"

[dependency-groups]
dev = [
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

# Pinned to the same rule set and Ruff version backend/ uses, so the gate does
# not float with whatever defaults the toolchain image's Ruff ships.
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ERA",   # eradicate (commented-out code)
    "RUF100", # unused noqa directives
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]
