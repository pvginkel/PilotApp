[project]
name = "pilot-scenario"
version = "0.1.0"
description = "Pilot's invented scenario and the builder that turns it into what each layer reads"
authors = [{ name = "Pieter van Ginkel", email = "pvginkel@gmail.com" }]
requires-python = ">=3.13,<4"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.0,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot_scenario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
