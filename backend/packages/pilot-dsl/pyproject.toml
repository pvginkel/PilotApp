[project]
name = "pilot-dsl"
version = "0.1.0"
description = "Pilot's block DSL: a document's front matter and blocks read, validated and written"
authors = [{ name = "Pieter van Ginkel", email = "pvginkel@gmail.com" }]
requires-python = ">=3.13,<4"
dependencies = ["pyyaml>=6.0.3,<7"]

[dependency-groups]
dev = ["pytest>=9.0.0,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot_dsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
