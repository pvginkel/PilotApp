projects:
  root:
    description: >-
      PilotApp monorepo — orchestration tooling (the suite runner), the
      shared Procfile.dev dev stack, and CI.
    setup: cexec modern-app uv sync --locked
    # The root's own Python only; backend/ and frontend/ lint themselves. The
    # rule set and the Ruff version are pinned in the root pyproject.toml.
    lint:
      - cexec modern-app uv run ruff check scripts tools
      # The architecture-as-code producer CI validates in AaC/PilotApp.
      # Exit 0 valid, 1 invalid, 2 transport — a 2 is the validation service,
      # not this repository.
      - cexec aac-tools arch-validate docs/architecture/*.yaml
    # No `test:` here on purpose. The root project owns `run-suite`
    # (tools/suite_runner), which is CI's single entry point and runs the
    # backend and frontend suites itself — declaring it here would make
    # `kc project test` run both suites two extra times. The per-component
    # verbs below are those same two suites, once each. CI keeps using
    # `uv run run-suite` because it also needs the JUnit XML, the retries
    # and the ===SUITE_RESULT:=== markers the Jenkinsfile parses.

  backend:
    description: >-
      The project manager that runs multi-step work across the KubeCoder fleet — Flask backend.
    setup:
      - cexec modern-app uv sync --locked
      - "test -f .env || printf 'DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/pilot\\n' > .env"
      - cexec modern-app uv run python scripts/init-dev-database.py
      - cexec modern-app uv run cli upgrade-db
    # Eight processes, each on databases of its own
    # (tests/conftest_infrastructure.py): about 1 min where serial took 5. Here,
    # not in addopts, so that a targeted `uv run pytest tests/...` stays one
    # process.
    test: cexec modern-app uv run pytest -n 8
    # The same three checks backend/scripts/check.py runs, and the formatter's
    # check.
    lint:
      - cexec modern-app uv run ruff check .
      - cexec modern-app uv run ruff format --check .
      - cexec modern-app uv run mypy .
      - cexec modern-app uv run vulture app/ vulture_whitelist.py --min-confidence 80

  frontend:
    description: >-
      React SPA with a generated OpenAPI client; Playwright E2E suite that boots
      the backend per worker.
    setup:
      - cexec modern-app pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - cexec modern-app pnpm playwright install chromium
    # `pnpm build` also runs `pnpm check`; the lint verb below repeats it so the
    # gate stands on its own.
    build: cexec modern-app pnpm build
    # Four workers over the template's two: 2.4 min where two took 4.3.
    # More gain nothing on the node's 8 cores, each worker a backend, a Vite
    # server and a Chromium of its own, about 1.1 GiB apiece.
    test: cexec modern-app pnpm playwright test --workers=4
    lint: cexec modern-app pnpm check

  sidecar:
    description: >-
      pilot-sync, the store environment's sync sidecar: a Go module that keeps
      the store's tree a live projection of the record.
    setup: cexec go go mod download
    build: cexec go go build ./...
    test: cexec go go test -race ./...
    lint:
      # gofmt exits 0 when it lists files: a listed file is the failure.
      - cexec go sh -c 'test -z "$(gofmt -l . | tee /dev/stderr)"'
      - cexec go go vet ./...
      - cexec go golangci-lint run ./...
