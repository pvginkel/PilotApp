# The environment for Pilot, the project manager that runs multi-step work
# across the KubeCoder fleet: the application, and the repos its work touches.
# Schema: https://kubecoder.home/help/reference/config-yaml/
#
# One sidecar rather than `python` + `frontend`: the Playwright harness boots the
# Flask backend per worker (frontend/tests/support/process/servers.ts), so a
# single command needs both toolsets in the same container.

repos:
  # Its spec repo: the design record and the slices. Shared: one clone per
  # project, mounted into every environment of it, because parallel sessions
  # read and append to the one working tree.
  - url: https://github.com/pvginkel/PilotAppSpecs
    shared: true
  # Its deploy chart and per-stage configuration.
  - url: https://github.com/pvginkel/PilotDeploy
  # The store environment's repo: the brain's skills, no data.
  - url: https://github.com/pvginkel/PilotProjects

capabilities:
  github: rw

secrets:
  # Pilot's KubeCoder client token for kubecoder-dev.home, the controller the
  # local live check of docs/slice-test-plan.md runs a real turn against. A
  # name the backend does not read: the check hands it to the dev stack as
  # CONTROLLER_TOKEN, and nothing else sees it under that name.
  PILOT_DEV_CONTROLLER_TOKEN: pilot-kubecoder-dev-token
  # The dev stage's test account, a user of production's realm holding the dev
  # client's `editor` role alone: the deployed checks of docs/slice-test-plan.md
  # sign in to pilot-dev.home with it.
  PILOT_DEV_TEST_USERNAME: pilot-dev-test-username
  PILOT_DEV_TEST_PASSWORD: pilot-dev-test-password

tools:
  - use: modern-app
  # PilotDeploy's Helm and Terraform gates.
  - use: iac
  # Its architecture gates: gen-architecture and arch-validate.
  - use: aac-tools
  # The sync sidecar (slice 003) is Go: Go and golangci-lint.
  - use: go

# Proves PilotApp's Dockerfiles with `kaniko --no-push` before a push hands
# them to Jenkins, which builds them with helmCharts.kaniko2(...).
imageBuilder: true

services:
  # Pilot's record lives in PostgreSQL. The backend's default DATABASE_URL
  # points at localhost:5432/pilot, and `kc project setup` creates that
  # database and applies the migrations. The backend suite and Playwright (a
  # clone of a seed database per worker) create their own databases on the
  # same server (TEST_DATABASE_ADMIN_URL) and never touch the dev one.
  - postgres

ports:
  - name: frontend
    port: 3500
    type: http
    sslOffload: true
  - name: backend
    port: 3501
    type: http
  # The timeline mockup (PilotAppSpecs design/mockup/), served by its
  # serve.py; design/mockup/README.md has the command. `sslOffload` gives it
  # https://mockup.<env-id>.home, which Chrome on Android needs to install it
  # to the home screen.
  - name: mockup
    port: 8080
    sslOffload: true
  # The chat mockup (PilotAppSpecs design/chat-mockup/): Vite's dev server in
  # the modern-app sidecar; design/chat-mockup/README.md has the command.
  # `sslOffload` for the phone, as the timeline mockup's.
  - name: chat-mockup
    port: 8081
    sslOffload: true

preamble:
  instructions: |
    Pilot's environment: the application (/work/PilotApp), with its
    design and slices in /work/PilotAppSpecs. Its work also touches
    /work/PilotDeploy (the deploy chart) and /work/PilotProjects (the
    store environment's skills).

    `cexec modern-app` runs the app's toolchain (uv, pnpm); `cexec iac`
    (Terraform, Helm, kubectl) and `cexec aac-tools` (gen-architecture,
    arch-validate) run PilotDeploy's gates.

    /work/PilotAppSpecs is a SHARED working tree: stage files by name
    there, never `git add -A`.
